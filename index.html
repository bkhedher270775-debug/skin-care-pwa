<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Care - Rear Fuse Inspection</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Feuille de style -->
    <link rel="stylesheet" href="style.css">
    
    <meta name="theme-color" content="#0F2744">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    
    <!-- Bibliothèque html2pdf pour la génération des rapports PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <div class="header-badge">REAR FUSE PN: C013900001-001</div>
            <h1>Skin Care — Inspection Production & Qualité</h1>
            <p>Documentation des anomalies de surface par numéro de série avion</p>
        </header>
        
        <main id="inspection-container">
            <!-- Interface générée dynamiquement par app.js -->
        </main>
    </div>

    <!-- Script principal -->
    <script src="app.js?v=8"></script>

    <!-- Enregistrement du Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker actif :', reg.scope))
                    .catch(err => console.error('Erreur Service Worker :', err));
            });
        }
    </script>
</body>
</html>
